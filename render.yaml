# Free Render web service. Feedback is stored in an external free Neon database.
# No paid instance, persistent disk, or managed database is created here.
services:
  - type: web
    name: signal-voc
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.lock.txt
    startCommand: ./scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DASHBOARD_AUTH
        value: "true"
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        generateValue: true
